<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .confirmation-container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin-top: 3rem;
        }

            .confirmation-container h1 {
                color: #2c3e50;
                margin-bottom: 1rem;
                font-size: 1.8rem;
            }

            .confirmation-container p {
                font-size: 1rem;
                color: #555;
                margin-bottom: 1.5rem;
            }

            .confirmation-container .checkmark {
                font-size: 1.5rem;
                color: #27ae60;
                margin-top: 1rem;
            }

            .confirmation-container a.button {
                display: inline-block;
                padding: 0.75rem 2rem;
                background: #2980b9;
                color: white;
                text-decoration: none;
                border-radius: 4px;
                font-weight: bold;
                transition: background 0.3s ease;
                font-size: 1rem;
                cursor: pointer;
            }

                .confirmation-container a.button:hover {
                    background: #3498db;
                }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="checkmark">Survey Cart</div>
        <h1>Hello {{name}}</h1>
        <p>To confirm your email, pleas click thr button below</p>
        <a href="https://example.com/activate?token=YOUR_TOKEN_HERE" class="button" target="_blank" rel="noopener noreferrer">Verify email Account</a>
        <p>Thanks,Survey Cart team</p>
    </div>
</body>
</html>
